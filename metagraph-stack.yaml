### Job definition for results merger job
  MetagraphMergeJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      RetryStrategy:
        Attempts: 1
      ContainerProperties:
        Image: public.ecr.aws/amazonlinux/amazonlinux:2023
        ResourceRequirements:
          - Type: VCPU
            Value: 8
          - Type: MEMORY
            Value: 32768
        Volumes:
          - Name: metagraph-bucket
            Host:
              SourcePath: /mnt/bucket
        MountPoints:
          - SourceVolume: metagraph-bucket
            ContainerPath: /mnt/bucket
        Command:
          - python3
          - -c
          - |
              import os
              import shutil
              import itertools as it
              from contextlib import ExitStack
              from concurrent.futures import ThreadPoolExecutor

              BUCKET_MOUNT = '/mnt/bucket'
              job_id = os.environ["JOB_ID"]
              mode = os.environ["QUERY_MODE"]

              if mode not in ['labels', 'matches']:
                  raise ValueError(f"Invalid query mode: {mode}")

              job_path = os.path.join(BUCKET_MOUNT, job_id)
              merged_key = f"{job_id}-result.txt"

              with ExitStack() as stack:
                  merged_file = stack.enter_context(open(merged_key, 'w'))

                  print(f"Merging results from {job_path}...")
                  with ThreadPoolExecutor() as executor:
                      file_paths = [os.path.join(job_path, f) for f in os.listdir(job_path)]
                      files = list(executor.map(lambda path: stack.enter_context(open(path, 'r')), file_paths))
                  print(f"Found {len(files)} files to merge...")

                  for Idx in it.count(0):
                      if Idx and Idx % 1000 == 0:
                          print(f"Processed {Idx} lines...")
                      with ThreadPoolExecutor() as executor:
                          lines = list(executor.map(lambda f: f.readline() or None, files))

                      if not lines or not all(lines):
                          break

                      Name = ''
                      Matches = []

                      for line in lines:
                          idx, name, *matches = line.strip().split('\t')
                          if not Name:
                              Name = name
                          assert name == Name and int(idx) == Idx

                          if mode == 'labels':
                              Matches += matches
                          elif mode == 'matches':
                              for match in matches:
                                  label, count = match.split(':')
                                  Matches.append((int(count), label))

                      if mode == 'labels':
                          content = f"{Idx}\t{Name}\t{':'.join(Matches)}\n"
                      elif mode == 'matches':
                          match_str = '\t'.join(f'{label}:{count}' for count, label in reversed(sorted(Matches)))
                          content = f"{Idx}\t{Name}\t{match_str}\n"

                      merged_file.write(content)

              print(f"Copying {merged_key} to the s3 bucket...")
              with open(merged_key, 'rb') as src, open(os.path.join(BUCKET_MOUNT, merged_key), 'wb') as dst:
                  dst.write(src.read())
        Environment:
          - Name: PYTHONUNBUFFERED
            Value: "1"
        JobRoleArn: !GetAtt MetagraphBatchJobRole.Arn

### Job definition for querying the dataset
  MetagraphBatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      RetryStrategy:
        Attempts: 1
      ContainerProperties:
        Image: public.ecr.aws/amazonlinux/amazonlinux:2023
        ResourceRequirements:
          - Type: VCPU
            Value: 4
          - Type: MEMORY
            Value: 32768
        Volumes:
          - Name: metagraph-data
            Host:
              SourcePath: /mnt/data
          - Name: metagraph-bucket
            Host:
              SourcePath: /mnt/bucket
          - Name: metagraph-bin
            Host:
              SourcePath: /opt/metagraph
          - Name: libdeflate
            Host:
              SourcePath: /usr/local/lib64
          - Name: lib64
            Host:
              SourcePath: /usr/lib64
        MountPoints:
          - SourceVolume: metagraph-data
            ContainerPath: /mnt/data
          - SourceVolume: metagraph-bucket
            ContainerPath: /mnt/bucket
          - SourceVolume: metagraph-bin
            ContainerPath: /opt/metagraph
          - SourceVolume: libdeflate
            ContainerPath: /usr/local/lib64
          - SourceVolume: lib64
            ContainerPath: /usr/lib64
        Command:
          - "/bin/bash"
          - "-c"
          - |
            set -e

            export PATH="/opt/metagraph/metagraph/build:$PATH"
            export LD_LIBRARY_PATH="/usr/local/lib64:/usr/lib64:$LD_LIBRARY_PATH"

            TIME_CMD=""
            if [[ -n "$TIME" ]]; then
                if ! rpm -q time &>/dev/null; then
                    dnf install -y time
                fi
                TIME_CMD="/usr/bin/time -v"
            fi

            PROC=$(eval echo "$PROC")
            RESULTS=$AWS_BATCH_JOB_ID.txt

            case "${CMD:-query}" in
              query)
                $TIME_CMD metagraph query $EXTRA_ARGS \
                  --threads-each "$THREADS_EACH" -p "$PROC" --batch-size "$BATCH_SIZE" \
                  -i "/mnt/data/$DATASET/$GRAPH_FILE" \
                  -a "/mnt/data/$DATASET/$ANNO_FILE" \
                  --query-mode "$QUERY_MODE" \
                  --num-top-labels "$NUM_TOP_LABELS" \
                  --min-kmers-fraction-label "$MIN_KMERS_FRACTION_LABEL" \
                  --min-kmers-fraction-graph "$MIN_KMERS_FRACTION_GRAPH" \
                  "/mnt/bucket/$QUERY" > $RESULTS
                ;;
              align)
                $TIME_CMD metagraph align $EXTRA_ARGS \
                  -p "$PROC" --batch-size "$BATCH_SIZE" \
                  -i "/mnt/data/$DATASET/$GRAPH_FILE" \
                  -a "/mnt/data/$DATASET/$ANNO_FILE" \
                  --align-min-seed-length "$ALIGN_MIN_SEED_LENGTH" \
                  --align-min-exact-match "$ALIGN_MIN_EXACT_MATCH" \
                  "/mnt/bucket/$QUERY" > $RESULTS
                ;;
              *)
                echo "Unsupported CMD value: ${CMD}" >&2
                exit 1
                ;;
            esac

            echo "Sorting $RESULTS by index..."
            sort -t $'\t' -k1,1n $RESULTS -o $RESULTS

            echo "Copying $RESULTS to /mnt/bucket/$JOB_ID..."
            mkdir -p "/mnt/bucket/$JOB_ID"
            cp $RESULTS "/mnt/bucket/$JOB_ID"
            echo "Copy completed successfully."
        JobRoleArn: !GetAtt MetagraphBatchJobRole.Arn

### Composes datasets matching filters into tasks
  MetagraphTaskCollector:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt MetagraphLambdaRole.Arn
      Runtime: python3.13
      Handler: index.lambda_handler
      Timeout: 300
      MemorySize: 256
      Description: |
        First-phase scheduler - discovers every index/graph pair and returns
        an array of minimal task objects.
      Code:
        ZipFile: !Sub |
          import boto3, re, json, os
          from collections import defaultdict

          s3 = boto3.client("s3")

          def list_indices(bucket, prefix, graph_suffix, anno_suffix):
              """Return {path: {'graph':file,'anno':file}} for all directories."""
              paginator = s3.get_paginator("list_objects_v2")
              prefix = prefix.strip("/");  prefix += prefix and "/"
              dirs = defaultdict(dict)

              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  for obj in page.get("Contents", []):
                      key = obj["Key"]
                      is_graph = key.endswith(graph_suffix)
                      is_anno  = key.endswith(anno_suffix)
                      if not (is_graph or is_anno):
                          continue
                      parts = key.split("/")
                      rel   = "/".join(parts[:-1])[len(prefix):]
                      dirs[rel]["graph" if is_graph else "anno"] = parts[-1]
              return dirs

          def size_mib(bucket, key):
              return s3.head_object(Bucket=bucket, Key=key)["ContentLength"] // (2**20)

          def lambda_handler(event, _):
              q   = event["query"]
              idx = q["index_prefix"].rstrip("/")
              bucket = "metagraph"

              graph_suffix = q.get("graph_suffix", "small.dbg")
              anno_suffix  = q.get("anno_suffix", "brwt.annodbg")
              regex        = re.compile(q.get("index_filter", ".*"))

              all_dirs  = list_indices(bucket, idx, graph_suffix, anno_suffix)
              matches   = [(path, files) for path, files in all_dirs.items() if regex.match(path)]

              job_id = q.get("job_id", event["arn"].split(":")[-1])
              query_key = f'queries/{q["query_filename"]}'
              query_size_mib = size_mib("${MetagraphBucket}", query_key)
              is_large_query = event["query"].get("large_query", query_size_mib >= 10)

              tasks = []
              query_mode = q.get("query_mode", "labels")
              for path, files in matches:
                  missing = {"graph", "anno"}-files.keys()
                  if missing:
                      print(f"Skipping {path}, missing required files: {missing}")
                      continue

                  dataset = idx + (path and "/") + path
                  dataset_mib = (
                      size_mib(bucket, f"{dataset}/{files['graph']}") +
                      size_mib(bucket, f"{dataset}/{files['anno']}") +
                      query_size_mib
                  )

                  tasks.append({
                      "time":          q.get("time", ""),
                      "cmd":           q.get("cmd", "query"),
                      "dataset":       dataset,
                      "graph_file":    files["graph"],
                      "anno_file":     files["anno"],
                      "query":         query_key,
                      "query_mode":    query_mode,
                      "num_top_labels":str(q.get("num_top_labels", "inf")),
                      "min_kmers_fraction_label": str(q.get("min_kmers_fraction_label", 0.7)),
                      "min_kmers_fraction_graph": str(q.get("min_kmers_fraction_graph", 0.0)),
                      "align_min_seed_length": str(q.get("align_min_seed_length", 27)),
                      "align_min_exact_match": str(q.get("align_min_exact_match", 0.85)),
                      "extra_args":    q.get("extra_args", ""),
                      "batch_size":    str(q.get("batch_size", 8*10**6)),
                      "proc":          q.get("proc", "$(nproc)"),
                      "job_id":        job_id,
                      "dataset_mib":   dataset_mib,
                      "is_large_query":is_large_query,
                      "retry_attempt": 0
                  })

              return {
                  "job_id":        job_id,
                  "start_time":    event["start_time"],
                  "query_mode":    query_mode,
                  "tasks":         tasks,
                  "merge":         q.get("merge", False)
              }

### For the input task, decides RAM/CPU parameters and the queue to be used
  MetagraphTaskConfigurator:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt MetagraphLambdaRole.Arn
      Runtime: python3.13
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 128
      Description: |
        Second-phase scheduler - given a single task from the collector,
        decide memory + Batch queue every attempt (fresh run or retry).
      Code:
        ZipFile: !Sub |
          import os, json

          def lambda_handler(event, _):
              t = event.copy()

              if not t["is_large_query"]:
                  t["memory_mib"] = str(t["dataset_mib"] + 6 * 1000 * 2**t["retry_attempt"])
                  t["job_queue"] = "${MetagraphBatchJobQueue}"
                  t["threads_each"] = "1"
              else:
                  t["memory_mib"] = 62500
                  while t["memory_mib"] <= t["dataset_mib"] + 20000:
                      t["memory_mib"] *= 2
                  t["memory_mib"] = str(t["memory_mib"] * 2**t["retry_attempt"])
                  use_super_queue = int(t["memory_mib"]) > 125000
                  if use_super_queue:
                      t["memory_mib"] = "756000" if int(t["memory_mib"]) > 250000 else "378000"
                  t["job_queue"] = "${MetagraphLargeBatchJobQueue}" if not use_super_queue else "${MetagraphSuperBatchJobQueue}"
                  t["threads_each"] = "32" if not use_super_queue else "48"

              t["retry_attempt"] += 1
              return t

### Approximate cost estimation for the query
  MetagraphCostEstimator:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt MetagraphLambdaRole.Arn
      Runtime: python3.13
      Handler: index.lambda_handler
      Timeout: 60
      Code:
        ZipFile: !Sub |
          import boto3
          import json
          import re
          from datetime import datetime, timezone
          from dateutil import parser

          cloudtrail = boto3.client("cloudtrail")
          pricing = boto3.client("pricing", region_name="us-east-1")

          def get_price_per_hour(instance_type):
              try:
                  response = pricing.get_products(
                      ServiceCode="AmazonEC2",
                      Filters=[
                          {"Type": "TERM_MATCH", "Field": "instanceType", "Value": instance_type},
                          {"Type": "TERM_MATCH", "Field": "location", "Value": "EU (Ireland)"},
                          {"Type": "TERM_MATCH", "Field": "operatingSystem", "Value": "Linux"},
                          {"Type": "TERM_MATCH", "Field": "tenancy", "Value": "Shared"},
                          {"Type": "TERM_MATCH", "Field": "preInstalledSw", "Value": "NA"},
                          {"Type": "TERM_MATCH", "Field": "usagetype", "Value": f"EU-BoxUsage:{instance_type}"}
                      ],
                      MaxResults=1
                  )
                  if not response['PriceList']:
                      return None
                  product = json.loads(response['PriceList'][0])
                  terms = product['terms']['OnDemand']
                  price_dimensions = next(iter(next(iter(terms.values()))['priceDimensions'].values()))
                  return float(price_dimensions['pricePerUnit']['USD'])
              except Exception as e:
                  print(f"Price fetch failed for {instance_type}: {e}")
                  return None

          def lambda_handler(event, context):
              start_time = parser.isoparse(event["start_time"])
              cutoff_time = datetime.now(timezone.utc)
              if "cutoff_time" in event:
                  cutoff_time = parser.isoparse(event["cutoff_time"])

              instance_lifetimes = {}  # instance_id -> {"launch_time": ..., "terminate_time": ..., "instance_type": ...}

              # Collect RunInstances and TerminateInstances events
              for event_name in ["RunInstances", "TerminateInstances"]:
                  paginator = cloudtrail.get_paginator("lookup_events")
                  for page in paginator.paginate(
                      LookupAttributes=[{"AttributeKey": "EventName", "AttributeValue": event_name}],
                      StartTime=start_time,
                      EndTime=cutoff_time
                  ):
                      for evt in page["Events"]:
                          event_time = evt["EventTime"]
                          try:
                              event_data = json.loads(evt["CloudTrailEvent"])
                              if event_data.get("errorCode") is not None:
                                  continue

                              for item in event_data["responseElements"]["instancesSet"]["items"]:
                                  instance_id = item["instanceId"]
                                  if event_name == "RunInstances":
                                      instance_type = item.get("instanceType") or event_data.get("requestParameters", {}).get("instanceType")
                                      instance_lifetimes.setdefault(instance_id, {})["launch_time"] = event_time
                                      instance_lifetimes[instance_id]["instance_type"] = instance_type
                                  elif event_name == "TerminateInstances":
                                      instance_lifetimes.setdefault(instance_id, {})["terminate_time"] = event_time
                          except Exception as e:
                              print(f"Failed to parse event: {e}")
                              print(evt)
                              continue

              total_cost = 0.0
              counted_instances = 0
              instance_details = []

              for instance_id, data in instance_lifetimes.items():
                  launch_time = data.get("launch_time")
                  if not launch_time or launch_time < start_time or launch_time > cutoff_time:
                      continue

                  terminate_time = data.get("terminate_time", cutoff_time)
                  runtime_hours = (terminate_time - launch_time).total_seconds() / 3600
                  instance_type = data.get("instance_type")
                  if not instance_type:
                      print(f"No instance_type for {instance_id}, skipping")
                      continue

                  price = get_price_per_hour(instance_type)
                  if price is None:
                      print(f"No price found for {instance_type}, skipping")
                      continue

                  instance_cost = price * runtime_hours
                  total_cost += instance_cost
                  counted_instances += 1

                  instance_details.append({
                      "instance_id": instance_id,
                      "instance_type": instance_type,
                      "price_per_hour": round(price, 4),
                      "runtime_hours": round(runtime_hours, 4),
                      "total_cost": round(instance_cost, 4)
                  })

              return {
                  "total_cost_usd": round(total_cost, 4),
                  "instance_count": counted_instances,
                  "per_instance_breakdown": instance_details
              }

### Post result notification by email
  MetagraphNotifier:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt MetagraphLambdaRole.Arn
      Runtime: python3.13
      Handler: index.lambda_handler
      Timeout: 60
      Code:
        ZipFile: !Sub |
          import boto3, os
          from botocore.config import Config
          from urllib.parse import urlparse

          sns = boto3.client("sns")
          s3 = boto3.client("s3", region_name='eu-west-1', endpoint_url='https://s3.eu-west-1.amazonaws.com')

          def lambda_handler(event, context):
              tasks = event["tasks"]
              fails = sum(task["status"] == "FAILED" for task in tasks)
              total = len(tasks)

              job_id = event["job_id"]
              mode = event["query_mode"]

              # Extract cost from wrapped Payload
              cost_info = event.get("estimated_cost", {}).get("Payload", {})
              cost_usd = cost_info.get("total_cost_usd")
              instance_count = cost_info.get("instance_count")

              cost_text = ""
              if cost_usd is not None:
                  cost_text = f"\n\nEstimated cost: {cost_usd:.2f} USD across {instance_count} instance(s)"

              presigned_url = s3.generate_presigned_url(
                  ClientMethod='get_object',
                  Params={'Bucket': '${MetagraphBucket}', 'Key': f'{job_id}-result.txt'},
                  ExpiresIn=7*24*60*60  # 7 days
              )

              print(f"Sending notification to topic ${MetagraphNotificationTopic}")
              sns.publish(
                  TopicArn="${MetagraphNotificationTopic}",
                  Message=(
                      f"Your Metagraph query {job_id} has completed.\n\n"
                      f"Query mode: {mode}\n"
                      f"Failed tasks: {fails} out of {total}{cost_text}\n\n"
                      f"Download your results here (valid for 7 days):\n\n{presigned_url}"
                  ),
                  Subject="Your Metagraph query has completed"
              )

### Step Functions State Machine for orchestrating the query process
  MetagraphStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt MetagraphStepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "InvokeScheduler",
          "States": {
            "InvokeScheduler": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${MetagraphTaskCollector.Arn}",
                "Payload": {
                  "arn.$": "$$.Execution.Id",
                  "query.$": "$",
                  "start_time.$": "$$.State.EnteredTime"
                }
              },
              "Next": "RunQueries"
            },
            "RunQueries": {
              "Type": "Map",
              "ItemsPath": "$.tasks",
              "MaxConcurrency": 200,

              "Iterator": {
                "StartAt": "ConfigureTask",

                "States": {
                  "ConfigureTask": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "FunctionName": "${MetagraphTaskConfigurator.Arn}",
                      "Payload.$": "$"
                    },
                    "Next": "SubmitQuery"
                  },
                  "SubmitQuery": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::batch:submitJob.sync",
                    "Parameters": {
                      "JobName.$": "States.Format('Query-{}', $.job_id)",
                      "JobQueue.$": "$.job_queue",
                      "JobDefinition": "${MetagraphBatchJobDefinition}",
                      "ContainerOverrides": {
                        "ResourceRequirements": [
                          {"Type": "VCPU", "Value": "1"},
                        {"Type": "MEMORY", "Value.$": "$.memory_mib"}
                        ],
                        "Environment": [
                          { "Name": "TIME",           "Value.$": "$.time" },
                          { "Name": "CMD",            "Value.$": "$.cmd" },
                          { "Name": "DATASET",        "Value.$": "$.dataset" },
                          { "Name": "GRAPH_FILE",     "Value.$": "$.graph_file" },
                          { "Name": "ANNO_FILE",      "Value.$": "$.anno_file" },
                          { "Name": "BATCH_SIZE",     "Value.$": "$.batch_size" },
                          { "Name": "EXTRA_ARGS",     "Value.$": "$.extra_args" },
                          { "Name": "PROC",           "Value.$": "$.proc" },
                          { "Name": "THREADS_EACH",   "Value.$": "$.threads_each" },
                          { "Name": "QUERY",          "Value.$": "$.query" },
                          { "Name": "JOB_ID",         "Value.$": "$.job_id" },
                          { "Name": "QUERY_MODE",     "Value.$": "$.query_mode" },
                          { "Name": "NUM_TOP_LABELS", "Value.$": "$.num_top_labels" },
                          { "Name": "MIN_KMERS_FRACTION_LABEL",  "Value.$": "$.min_kmers_fraction_label" },
                          { "Name": "MIN_KMERS_FRACTION_GRAPH",  "Value.$": "$.min_kmers_fraction_graph" },
                          { "Name": "ALIGN_MIN_SEED_LENGTH",  "Value.$": "$.align_min_seed_length" },
                          { "Name": "ALIGN_MIN_EXACT_MATCH",  "Value.$": "$.align_min_exact_match" },
                          { "Name": "MANAGED_BY_AWS", "Value":   "STARTED_BY_STEP_FUNCTIONS" }
                        ]
                      },
                      "Tags": { "Name.$": "$.job_id" }
                    },
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "ResultPath": "$.error",
                        "Next": "CheckRetryLimit"
                      }
                    ],
                    "Next": "MarkSucceeded"
                  },
                  "CheckRetryLimit": {
                    "Type": "Choice",
                    "Choices": [
                      { "Variable": "$.retry_attempt", "NumericLessThan": 3, "Next": "ConfigureTask" }
                    ],
                    "Default": "MarkFailed"
                  },
                  "MarkSucceeded": { "Type": "Pass", "Result": { "status": "SUCCEEDED" }, "End": true },
                  "MarkFailed":    { "Type": "Pass", "Result": { "status": "FAILED"    }, "End": true }
                }
              },
              "ResultPath": "$.tasks",
              "Next": "ShouldMerge"
            },
            "ShouldMerge": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.merge",
                  "BooleanEquals": true,
                  "Next": "GatherResults"
                }
              ],
              "Default": "EstimateCost"
            },
            "GatherResults": {
              "Type": "Task",
              "Resource": "arn:aws:states:::batch:submitJob.sync",
              "Parameters": {
                "JobName.$": "States.Format('Merge-{}', $.job_id)",
                "JobQueue": "${MetagraphBatchJobQueue}",
                "JobDefinition": "${MetagraphMergeJobDefinition}",
                "ContainerOverrides": {
                  "Environment": [
                    { "Name": "MANAGED_BY_AWS", "Value": "STARTED_BY_STEP_FUNCTIONS" },
                    { "Name": "JOB_ID", "Value.$": "$.job_id" },
                    { "Name": "QUERY_MODE", "Value.$": "$.query_mode" },
                    { "Name": "PYTHONUNBUFFERED", "Value": "1" }
                  ]
                }
              },
              "ResultPath": null,
              "Next": "EstimateCost"
            },
            "EstimateCost": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "ResultPath": "$.estimated_cost",
              "Parameters": {
                "FunctionName": "${MetagraphCostEstimator.Arn}",
                "Payload": {
                  "job_id.$": "$.job_id",
                  "start_time.$": "$.start_time"
                }
              },
              "Next": "NotifyUser"
            },
            "NotifyUser": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${MetagraphNotifier.Arn}",
                "Payload.$": "$"
              },
              "End": true
            }
          }
        }

### Step Functions State Machine for running experiments from Metagraph paper
  MetagraphBatchRunner:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt MetagraphStepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "InitializeQueryList",
          "States": {
            "InitializeQueryList": {
              "Type": "Pass",
              "Result": {
                "queries": [
                  "1",
                  "10",
                  "20",
                  "50",
                  "100",
                  "500",
                  "2k5",
                  "5k"
                ]
              },
              "ResultPath": "$.query_batch",
              "Next": "RunQueriesSequentially"
            },
            "RunQueriesSequentially": {
              "Type": "Map",
              "ItemsPath": "$.query_batch.queries",
              "MaxConcurrency": 1,
              "Parameters": {
                "index_prefix.$": "$.index_prefix",
                "index_filter.$": "$.index_filter",
                "graph_suffix.$": "$.graph_suffix",
                "anno_suffix.$": "$.anno_suffix",
                "query_mode.$": "$.query_mode",
                "num_top_labels.$": "$.num_top_labels",
                "min_kmers_fraction_label.$": "$.min_kmers_fraction_label",
                "query_filename.$": "States.Format('100_studies_{}_short.fq', $$.Map.Item.Value)",
                "job_id.$": "States.Format('{}-{}', $.job_id, $$.Map.Item.Value)"
              },
              "Iterator": {
                "StartAt": "InvokeMetagraphStateMachine",
                "States": {
                  "InvokeMetagraphStateMachine": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::states:startExecution.sync",
                    "Parameters": {
                      "StateMachineArn": "${MetagraphStateMachine}",
                      "Input": {
                        "index_prefix.$": "$.index_prefix",
                        "index_filter.$": "$.index_filter",
                        "graph_suffix.$": "$.graph_suffix",
                        "anno_suffix.$": "$.anno_suffix",
                        "query_mode.$": "$.query_mode",
                        "num_top_labels.$": "$.num_top_labels",
                        "min_kmers_fraction_label.$": "$.min_kmers_fraction_label",
                        "query_filename.$": "$.query_filename",
                        "job_id.$": "$.job_id"
                      }
                    },
                    "Next": "Wait5Minutes"
                  },
                  "Wait5Minutes": {
                    "Type": "Wait",
                    "Seconds": 300,
                    "End": true
                  }
                }
              },
              "End": true
            }
          }
        }


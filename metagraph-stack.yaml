AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploys an AWS Batch-based system for Metagraph query execution.'

Parameters:
  MetagraphAmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI ID to use for Metagraph Batch instances
  MetagraphArmAmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI ID to use for Metagraph Batch instances on ARM (Graviton)
  NotificationEmail:
    Type: String
    Description: Email address to subscribe to the SNS topic
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The security group for your VPC

Resources:

### Roles and profiles
  ECSInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Policies:
        - PolicyName: MountS3ReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - arn:aws:s3:::metagraph
                  - arn:aws:s3:::metagraph/*
                  - !Sub arn:aws:s3:::${MetagraphBucket}
                  - !Sub arn:aws:s3:::${MetagraphBucket}/*

  ECSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ECSInstanceRole

  MetagraphLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowCloudTrailLookup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: "*"
        - PolicyName: AllowCloudWatchLogging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: AllowPricingGetProducts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - pricing:GetProducts
                Resource: "*"
        - PolicyName: LambdaDescribeEC2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: "*"
        - PolicyName: LambdaSubmitBatchJobsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'batch:SubmitJob'
                  - 'batch:DescribeJobs'
                Resource: "*"
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource:
                  - 'arn:aws:s3:::metagraph*'
                  - !Sub 'arn:aws:s3:::${MetagraphBucket}*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref MetagraphNotificationTopic

  MetagraphStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsNestedExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: "*"
        - PolicyName: StepFunctionsBatchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                  - batch:DescribeJobs
                  - batch:TagResource
                Resource: "*"
        - PolicyName: StepFunctionsInvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt MetagraphTaskCollector.Arn
                  - !GetAtt MetagraphTaskConfigurator.Arn
                  - !GetAtt MetagraphNotifier.Arn
                  - !GetAtt MetagraphCostEstimator.Arn
        - PolicyName: StepFunctionsEventBridgePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                  - events:DeleteRule
                  - events:RemoveTargets
                Resource: "*"

  MetagraphBatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MetagraphJobS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:ListBucket'
                Resource:
                  - 'arn:aws:s3:::metagraph*'
                  - !Sub 'arn:aws:s3:::${MetagraphBucket}'
                  - !Sub 'arn:aws:s3:::${MetagraphBucket}/*'

  AgentDisconnectHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SqsRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt AgentDisconnectedQueue.Arn
        - PolicyName: KillUnhealthyECSInstance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeContainerInstances
                  - ecs:UpdateContainerInstancesState
                Resource: "*"
              - Effect: Allow
                Action:
                  - autoscaling:TerminateInstanceInAutoScalingGroup
                Resource: "*"

### Main stack bucket
  MetagraphBucket:
    Type: AWS::S3::Bucket

### SNS topic for notifications
  MetagraphNotificationTopic:
    Type: AWS::SNS::Topic

  MetagraphNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref MetagraphNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

### Launch templates for container service with s3 bucket mounting
  MetagraphArmLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        IamInstanceProfile: { Name: !Ref ECSInstanceProfile }
        ImageId: !Ref MetagraphArmAmiId
        UserData:
          Fn::Base64: !Sub |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BOUNDARY=="

            --==BOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            set -eux

            for svc in sshd amazon-ssm-agent systemd-journald; do
              mkdir -p "/etc/systemd/system/$svc.service.d"
              cat >"/etc/systemd/system/$svc.service.d/oom.conf" <<'EOF'
            [Service]
            OOMScoreAdjust=-900
            EOF
            done

            systemctl daemon-reload
            systemctl restart sshd amazon-ssm-agent systemd-journald

            mkdir -p /mnt/data /mnt/bucket

            export UNSTABLE_MOUNTPOINT_MAX_PREFETCH_WINDOW_SIZE=536870912

            mount-s3 --read-only metagraph /mnt/data
            mount-s3 ${MetagraphBucket} /mnt/bucket

            for pid in $(pidof mount-s3); do
              echo -1000 > /proc/$pid/oom_score_adj
            done

            --==BOUNDARY==--

  MetagraphLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        IamInstanceProfile: { Name: !Ref ECSInstanceProfile }
        ImageId: !Ref MetagraphAmiId
        UserData:
          Fn::Base64:
          Fn::Base64: !Sub |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BOUNDARY=="

            --==BOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            set -eux

            for svc in sshd amazon-ssm-agent systemd-journald; do
              mkdir -p "/etc/systemd/system/$svc.service.d"
              cat >"/etc/systemd/system/$svc.service.d/oom.conf" <<'EOF'
            [Service]
            OOMScoreAdjust=-900
            EOF
            done

            systemctl daemon-reload
            systemctl restart sshd amazon-ssm-agent systemd-journald

            mkdir -p /mnt/data /mnt/bucket

            export UNSTABLE_MOUNTPOINT_MAX_PREFETCH_WINDOW_SIZE=536870912

            mount-s3 --read-only metagraph /mnt/data
            mount-s3 ${MetagraphBucket} /mnt/bucket

            for pid in $(pidof mount-s3); do
              echo -1000 > /proc/$pid/oom_score_adj
            done

            --==BOUNDARY==--

### Handling ECS agent disconnects
  AgentDisconnectedQueue:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 300      # 5-minute grace period
      VisibilityTimeout: 120

  AgentDisconnectHandler:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt AgentDisconnectHandlerRole.Arn
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Code:
        ZipFile: |
          import boto3, json
          ecs = boto3.client("ecs")
          asg = boto3.client("autoscaling")

          def handler(event, _):
              detail = json.loads(event['Records'][0]['body'])['detail']
              cluster = detail['clusterArn']
              inst_arn = detail['containerInstanceArn']
              ec2_id   = detail['ec2InstanceId']

              # double-check after the delay
              inst = ecs.describe_container_instances(
                  cluster=cluster,
                  containerInstances=[inst_arn]
              )['containerInstances'][0]
              if inst['agentConnected']:
                  return                                      # agent recovered

              ecs.update_container_instances_state(
                  cluster=cluster,
                  containerInstances=[inst_arn],
                  status='DRAINING'
              )

              asg.terminate_instance_in_auto_scaling_group(
                  InstanceId=ec2_id,
                  ShouldDecrementDesiredCapacity=False       # replace it
              )

  AgentDisconnectRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: ["aws.ecs"]
        detail-type: ["ECS Container Instance State Change"]
        detail:
          agentConnected: [false]
      Targets:
        - Arn: !GetAtt AgentDisconnectedQueue.Arn
          Id: QueueTarget

  AgentDisconnectedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AgentDisconnectedQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AgentDisconnectedQueue.Arn

  QueueLambdaMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt AgentDisconnectedQueue.Arn
      FunctionName: !Ref AgentDisconnectHandler

### hpc7a Compute Environment for RAM- and compute-intensive jobs
  MetagraphSuperBatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 192
        InstanceTypes:
          - hpc7a.96xlarge  # 192 vCPU, 768 GiB
        Subnets:
          - subnet-0a54e9b2712059ce5 # eu-west-1a
          - subnet-010153849061cb13b # eu-west-1b
          - subnet-051ff0b8516072df4 # eu-west-1c
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt ECSInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref MetagraphLaunchTemplate
          Version: !GetAtt MetagraphLaunchTemplate.LatestVersionNumber

